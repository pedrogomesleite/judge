spring.application.name=runner-cpp
spring.main.web-application-type=none
# RabbitMQ (ADR-006)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:juizin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:juizin}
spring.rabbitmq.connection-timeout=5s
# O resultado só conta como publicado com o confirm do broker e uma fila de destino
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Um consumidor por box, com uma mensagem por vez: o prefetch total da réplica é o número de boxes
spring.rabbitmq.listener.simple.concurrency=${juizin.runner.boxes}
spring.rabbitmq.listener.simple.max-concurrency=${juizin.runner.boxes}
spring.rabbitmq.listener.simple.prefetch=1
# Falha de infraestrutura: 2 novas tentativas com espera crescente; depois, a DLQ (a API marca a solução como FALHA)
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2

# Runner
juizin.runner.fila=submissions.cpp
juizin.runner.boxes=${JUIZIN_RUNNER_BOXES:2}
juizin.runner.api-url=${JUIZIN_RUNNER_API_URL:http://localhost:8080}
juizin.runner.token=${JUIZIN_RUNNER_TOKEN:juizin-dev-runner-token-change-me-0123456789}
juizin.runner.isolate=/usr/local/bin/isolate
juizin.runner.compilador=/usr/bin/g++
juizin.runner.tempo-compilacao=PT10S
juizin.runner.memoria-compilacao-mb=512
juizin.runner.tamanho-maximo-arquivo-kb=65536
juizin.runner.timeout-api=PT10S
juizin.runner.timeout-confirmacao=PT5S
juizin.runner.max-casos-em-cache=1000

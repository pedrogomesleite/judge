info:
  name: Excluir grupo sem estudantes (A)
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/groups/{{emptyGroupId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

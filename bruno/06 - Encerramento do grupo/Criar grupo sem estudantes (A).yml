info:
  name: Criar grupo sem estudantes (A)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/groups"
  body:
    type: json
    data: |-
      {
        "nome": "Grupo a ser excluído"
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: emptyGroupId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Finalizar grupo (B, agora avaliador)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/groups/{{groupId}}/finish"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: FINALIZADO

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

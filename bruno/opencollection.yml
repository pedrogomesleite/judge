opencollection: 1.0.0

info:
  name: "Juizin API"

request:
  variables:
    - name: "baseUrl"
      value: "http://localhost:8080"

docs:
  content: |-
    Fluxo completo da API do Juizin. Execute as pastas em ordem (Runner da coleção ou request a request).

    - Tokens e ids são salvos em variáveis de runtime (pós-resposta) e usados pelos requests seguintes.
    - Usuário A (ana) = criador/avaliador do grupo. Usuário B (beto) = estudante que entra pelo convite.
    - O runner simulado da API (juizin.runner.mock.enabled) conclui as soluções em ~4s.
      A diretiva "// juizin-mock: <VEREDITO>" no código força o veredito.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

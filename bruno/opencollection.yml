opencollection: 1.0.0

info:
  name: "Juizin API"

request:
  variables:
    - name: "baseUrl"
      value: "http://localhost:8080"

docs:
  content: |-
    Fluxo completo da API do Juizin. Execute as pastas em ordem (Runner da coleção ou request a request).

    - Tokens e ids são salvos em variáveis de runtime (pós-resposta) e usados pelos requests seguintes.
    - Usuário A (ana) = criador/avaliador do grupo. Usuário B (beto) = estudante que entra pelo convite.
    - As soluções são avaliadas pelo runner C++ de verdade (RabbitMQ + runner-cpp, ver compose.yaml):
      suba o ambiente com `docker compose up -d --build` (ou, com a API na IDE, o rabbitmq e o runner-cpp)
      antes da pasta 04. O veredito costuma chegar em poucos segundos.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

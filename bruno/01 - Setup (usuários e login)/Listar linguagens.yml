info:
  name: Listar linguagens
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/languages"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body[0].id
        method: jsonq
      variable:
        name: languageId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

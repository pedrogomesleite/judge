info:
  name: Cadastrar usuário A
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/users"
  body:
    type: json
    data: |-
      {
        "nome": "Ana Avaliadora",
        "login": "ana",
        "senha": "senha1234"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: 201, 409

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 201 na primeira execução; 409 nas seguintes (login já existe).

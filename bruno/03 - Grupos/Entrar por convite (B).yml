info:
  name: Entrar por convite (B)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/groups/join/{{inviteCode}}"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.meuPapel
      operator: eq
      value: ESTUDANTE

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

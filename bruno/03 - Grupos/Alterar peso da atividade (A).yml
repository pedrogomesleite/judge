info:
  name: Alterar peso da atividade (A)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/groups/{{groupId}}/activities/{{activityId}}"
  body:
    type: json
    data: |-
      {
        "peso": 3
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.peso
      operator: eq
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Listar casos compartilhados nos meus grupos (B)
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/activities/{{activityId}}/test-cases/shared"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "1"
    - expression: res.body[0].grupoId
      operator: eq
      value: '"{{groupId}}"'
    - expression: res.body[0].grupoNome
      operator: eq
      value: '"Turma de Algoritmos 2026"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

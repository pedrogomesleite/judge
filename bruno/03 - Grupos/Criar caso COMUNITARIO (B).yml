info:
  name: Criar caso COMUNITARIO (B)
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/activities/{{activityId}}/test-cases"
  body:
    type: json
    data: |-
      {
        "entrada": "0 0\n",
        "saidaEsperada": "0\n",
        "tipo": "COMUNITARIO",
        "grupoId": "{{groupId}}"
      }
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: communityTestCaseId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Iniciar grupo (A)
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/groups/{{groupId}}/start"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: EM_ANDAMENTO

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Remover avaliador do grupo (A) -> 422
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/api/groups/{{groupId}}/members/{{userAId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Só estudantes podem ser removidos (antes do início do grupo): o grupo nunca fica sem avaliador.

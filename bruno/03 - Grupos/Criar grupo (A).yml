info:
  name: Criar grupo (A)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/groups"
  body:
    type: json
    data: |-
      {
        "nome": "Turma de Algoritmos 2026",
        "descricao": "Lista 1 - aquecimento"
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: groupId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.codigoConvite
        method: jsonq
      variable:
        name: inviteCode
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

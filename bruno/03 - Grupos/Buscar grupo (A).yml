info:
  name: Buscar grupo (A)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/groups/{{groupId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

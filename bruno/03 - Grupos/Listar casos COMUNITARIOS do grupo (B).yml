info:
  name: Listar casos COMUNITARIOS do grupo (B)
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/activities/{{activityId}}/test-cases?groupId={{groupId}}"
  params:
    - name: groupId
      value: "{{groupId}}"
      type: query
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Relatório do grupo (B, só o próprio)
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/groups/{{groupId}}/report"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "1"
    - expression: res.body[0].usuarioId
      operator: eq
      value: "{{userBId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Enviar solução com RESPOSTA_ERRADA (A)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/submissions"
  body:
    type: json
    data: |-
      {
        "atividadeId": "{{activityId}}",
        "linguagemId": "{{languageId}}",
        "codigo": "#include <iostream>\nint main() {\n    int a, b;\n    std::cin >> a >> b;\n    std::cout << a - b << std::endl;\n    return 0;\n}"
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"
    - expression: res.body.status
      operator: eq
      value: PENDENTE
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: wrongSubmissionId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 'Imprime A - B em vez de A + B: o runner compila, executa os casos oficiais e devolve RESPOSTA_ERRADA.'

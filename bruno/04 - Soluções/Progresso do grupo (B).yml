info:
  name: Progresso do grupo (B)
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/groups/{{groupId}}/progress"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "1"
    - expression: res.body[0].aceitas
      operator: eq
      value: "1"
    - expression: res.body[0].totalAtividades
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Placar visível a qualquer membro: atividades com pelo menos um envio aceito (aceites repetidos não somam) sobre o total do grupo.

info:
  name: Buscar código da solução de B (A, avaliador)
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/submissions/{{submissionId}}/code"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.extensao
      operator: eq
      value: cpp

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

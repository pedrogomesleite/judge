info:
  name: Listar soluções do grupo (A, vê todas)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/submissions?groupId={{groupId}}"
  params:
    - name: groupId
      value: "{{groupId}}"
      type: query
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Buscar solução (A) -> RESPOSTA_ERRADA
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/submissions/{{wrongSubmissionId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: CONCLUIDA
    - expression: res.body.veredito
      operator: eq
      value: RESPOSTA_ERRADA

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

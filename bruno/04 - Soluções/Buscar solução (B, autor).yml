info:
  name: Buscar solução (B, autor)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/submissions/{{submissionId}}"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Aguardar runner simulado e buscar solução (B) -> ACEITA
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/submissions/{{submissionId}}"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  scripts:
    - type: before-request
      code: await bru.sleep(5000);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: CONCLUIDA
    - expression: res.body.veredito
      operator: eq
      value: ACEITA

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Espera 5s (bru.sleep no pré-request) para o runner simulado concluir.

info:
  name: Listar casos OFICIAIS (autor)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/activities/{{activityId}}/test-cases"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  variables:
    - name: activityId
      value: 1c989304-e5b3-461a-ae01-09498b963cdb
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

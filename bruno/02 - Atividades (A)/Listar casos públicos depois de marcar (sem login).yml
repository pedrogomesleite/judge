info:
  name: Listar casos públicos depois de marcar (sem login)
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/activities/{{activityId}}/test-cases/public"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Listar atividades (público, sem login)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/activities"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

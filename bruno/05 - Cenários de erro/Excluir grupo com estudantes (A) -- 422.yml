info:
  name: Excluir grupo com estudantes (A) -> 422
  type: http
  seq: 20

http:
  method: DELETE
  url: "{{baseUrl}}/api/groups/{{groupId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Um grupo com membros ESTUDANTE não pode ser excluído, em nenhum status.

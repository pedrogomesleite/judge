info:
  name: Remover estudante com grupo em andamento (A) -> 422
  type: http
  seq: 16

http:
  method: DELETE
  url: "{{baseUrl}}/api/groups/{{groupId}}/members/{{userBId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Estudantes só podem ser removidos antes do início do grupo.

spring.application.name=judge
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# JWT (HS256) - em produção, defina JUIZIN_JWT_SECRET com no mínimo 32 caracteres
juizin.jwt.secret=${JUIZIN_JWT_SECRET:juizin-dev-secret-change-me-0123456789abcdef}
juizin.jwt.expiration=PT2H
# RabbitMQ (ADR-006). O usuário guest só conecta de localhost; o compose.yaml cria o usuário juizin
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:juizin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:juizin}
spring.rabbitmq.connection-timeout=5s
# Publisher confirms + mandatory: publicadaEm só é gravado quando o broker confirma e a mensagem chega a uma fila
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Listeners: 3 novas tentativas com espera crescente; depois, a mensagem vai para a DLQ (juizin.dlx)
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
juizin.mensageria.timeout-confirmacao=PT5S
# Republica as soluções não publicadas (ADR-007)
juizin.reconciliacao.intervalo=PT30S
juizin.reconciliacao.idade-minima=PT30S
# Token de serviço do runner no endpoint interno de casos de teste (ADR-008) - em produção, defina JUIZIN_RUNNER_TOKEN
juizin.runner.token=${JUIZIN_RUNNER_TOKEN:juizin-dev-runner-token-change-me-0123456789}


spring.docker.compose.enabled=false
spring.datasource.url=jdbc:postgresql://localhost:5432/juizin
spring.datasource.username=postgres
spring.datasource.password=postgres

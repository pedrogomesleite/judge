spring.application.name=judge
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# JWT (HS256) - em produção, defina JUIZIN_JWT_SECRET com no mínimo 32 caracteres
juizin.jwt.secret=${JUIZIN_JWT_SECRET:juizin-dev-secret-change-me-0123456789abcdef}
juizin.jwt.expiration=PT2H
# Runner simulado enquanto a integração com o RabbitMQ é TODO (ADR-006/007)
juizin.runner.mock.enabled=true
juizin.runner.mock.atraso=PT2S


spring.docker.compose.enabled=false
spring.datasource.url=jdbc:postgresql://localhost:5432/juizin
spring.datasource.username=postgres
spring.datasource.password=postgres

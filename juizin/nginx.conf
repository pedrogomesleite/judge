server {
    listen 80;
    root /usr/share/nginx/html;

    # O nome "api" é resolvido no DNS do Docker a cada 10 s: o nginx sobe mesmo com a API fora do ar
    # e acompanha a troca de IP quando o container da API é recriado.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE (/api/groups/{id}/events e /api/submissions/{id}/events): sem buffer e com conexão longa
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Rotas do Vue Router (createWebHistory): o que não é arquivo cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

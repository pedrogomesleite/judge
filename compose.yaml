#   Frontend: http://localhost:8081 | API: http://localhost:8080 | RabbitMQ: http://localhost:15672 (juizin/juizin)
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=juizin'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      # Por TCP: durante a inicialização, o Postgres aceita só conexões pelo socket local
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d juizin']
      interval: 5s
      timeout: 5s
      retries: 20

  # Mensageria entre a API e os runners (ADR-006)
  rabbitmq:
    image: 'rabbitmq:4-management'
    # Nome de nó fixo: os dados do volume ficam ligados a ele e sobrevivem à recriação do container
    hostname: rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_USER=juizin'
      - 'RABBITMQ_DEFAULT_PASS=juizin'
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - 'rabbitmq-data:/var/lib/rabbitmq'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  # API (Spring Boot). As variáveis sobrescrevem o banco e o broker do application.properties.
  api:
    build: .
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/juizin'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=postgres'
      - 'RABBITMQ_HOST=rabbitmq'
      # Igual ao do runner-cpp
      - 'JUIZIN_RUNNER_TOKEN=juizin-dev-runner-token-change-me-0123456789'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Frontend (Vue servido pelo nginx, que encaminha /api para a API)
  web:
    build: ./juizin
    ports:
      - '8081:80'
    depends_on:
      - api

  # Runner C++ (ADR-002, ADR-005, ADR-008): privilegiado e com cgroup namespace próprio, por causa do isolate.
  # Com a API na IDE: JUIZIN_RUNNER_API_URL=http://host.docker.internal:8080 docker compose up -d rabbitmq runner-cpp
  runner-cpp:
    build: ./runner-cpp
    privileged: true
    cgroup: private
    environment:
      - 'RABBITMQ_HOST=rabbitmq'
      - 'JUIZIN_RUNNER_API_URL=${JUIZIN_RUNNER_API_URL:-http://api:8080}'
      - 'JUIZIN_RUNNER_TOKEN=juizin-dev-runner-token-change-me-0123456789'
      - 'JUIZIN_RUNNER_BOXES=2'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
